[tools]
node = "26.13.0"
bun = "1.4.4"
# script/tree-sitter builds the CLI with the `wasm` feature when no released binary runs here; wasmtime's build runs cmake.
cmake = "4.4.5"

[env]
# The tree-sitter CLI otherwise caches compiled parsers by language name in a directory shared by every checkout and
# reuses one newer than the sources, so another checkout's parser could be used instead of this one's.
TREE_SITTER_LIBDIR = "{{config_root}}/.tmp/tree-sitter-lib"
