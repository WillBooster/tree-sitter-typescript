name: Robustness
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # The scanner depends on the C library (e.g. `iswalpha`), and the Rust binding compiles it natively, so the
  # tests run on other common platforms too; the Test workflow covers ubuntu-latest.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
      - run: bun install --frozen-lockfile
      - run: bun run test/ci-setup
      - run: bun run build/ci
      # The packages ship the committed typescript/src/ and tsx/src/, so they must be what the grammars generate.
      # `git add -N` makes files that generation adds but nobody committed show up in the diff too.
      - run: git add --intent-to-add -- typescript/src/ tsx/src/ && git diff --exit-code -- typescript/src/ tsx/src/
      - run: bun run test/ci
  # Runs the parser under libFuzzer with AddressSanitizer and UndefinedBehaviorSanitizer, seeded with the
  # input of each corpus case. A grammar change alters which tokens the scanner is asked for, so it runs
  # on every change, not only on scanner changes. The parser runs on WillBooster/tree-sitter at the
  # willbooster-tree-sitter version in Cargo.lock, the runtime the Rust tests use: the error recovery of
  # upstream's runtime never ends on some inputs.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        grammar:
          - typescript
          - tsx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: runtime
        run: |
          version=$(script/runtime-version)
          echo "ref=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: WillBooster/tree-sitter
          ref: ${{ steps.runtime.outputs.ref }}
          path: .tmp/tree-sitter
          persist-credentials: false
      # tree-sitter/fuzz-action can only build upstream's runtime, so only its harness and sanitizer ignore list are
      # used, and its build is reproduced below.
      - uses: actions/checkout@v7.0.1
        with:
          repository: tree-sitter/fuzz-action
          ref: v4
          path: .tmp/fuzz-action
          persist-credentials: false
      - run: |
          mkdir -p .tmp/fuzz-seeds
          corpus=$(find test/corpus -name '*.txt' | LC_ALL=C sort)
          # Perl keeps the NUL characters of test/corpus/nul_characters.txt, at which some awk implementations (e.g.
          # macOS's) end a line.
          perl -ne '
            if ($state != 2 && /^=+$/) { open $seed, ">", sprintf(".tmp/fuzz-seeds/%d", ++$n) or die $! if ++$state == 2; next }
            if ($state == 2 && /^---+$/) { $state = 0; close $seed; next }
            print $seed $_ if $state == 2;
          ' $corpus
          # libFuzzer runs just as well without seeds, so the split itself must show that each corpus case and every NUL
          # character reached them. A case without its `---` line would share the next case's seed, so the `===` lines,
          # two a case, are counted too.
          cases=$(cat $corpus | grep -a -c -E '^---+$' || true)
          headers=$(cat $corpus | grep -a -c -E '^===+$' || true)
          seeds=$(find .tmp/fuzz-seeds -type f | wc -l)
          corpus_nuls=$(cat $corpus | tr -dc '\000' | wc -c)
          seed_nuls=$(find .tmp/fuzz-seeds -type f -exec cat {} + | tr -dc '\000' | wc -c)
          echo "Corpus: $cases cases, $headers header lines, $corpus_nuls NULs; seeds: $seeds files, $seed_nuls NULs"
          test "$cases" -gt 0
          test "$seeds" -eq "$cases"
          test "$headers" -eq $((2 * cases))
          test "$seed_nuls" -eq "$corpus_nuls"
      - name: Build the fuzzer
        run: |
          jq '.. | select((.type? == "STRING" or (.type? == "ALIAS" and .named? == false)) and .value? != "") | .value' \
            "$GRAMMAR/src/grammar.json" | grep -v '\\' | iconv -c -f UTF-8 -t ASCII//TRANSLIT > .tmp/fuzz-dict
          # Like tree-sitter/fuzz-action, only the grammar is instrumented, not the runtime.
          clang -std=c11 -Og -g -c -D_POSIX_C_SOURCE=200112L -D_DEFAULT_SOURCE -I.tmp/tree-sitter/lib/include \
            -I.tmp/tree-sitter/lib/src .tmp/tree-sitter/lib/src/lib.c -o .tmp/tree-sitter.o
          clang -std=c11 -Og -g -fsanitize=fuzzer,address,undefined \
            -fsanitize-ignorelist=.tmp/fuzz-action/ignorelist.ini -I.tmp/tree-sitter/lib/include -I"$GRAMMAR/src" \
            -DTS_LANG="tree_sitter_$GRAMMAR" .tmp/fuzz-action/fuzzer.c "$GRAMMAR/src/parser.c" "$GRAMMAR/src/scanner.c" \
            .tmp/tree-sitter.o -o .tmp/fuzzer
        env:
          GRAMMAR: ${{ matrix.grammar }}
      - name: Fuzz
        run: |
          mkdir -p .tmp/fuzz-out .tmp/fuzz-artifacts
          .tmp/fuzzer .tmp/fuzz-out .tmp/fuzz-seeds -dict=.tmp/fuzz-dict -artifact_prefix=.tmp/fuzz-artifacts/ \
            -timeout=10 -max_total_time=300 -max_len=4096
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: fuzzer-artifacts-${{ matrix.grammar }}
          path: .tmp/fuzz-artifacts/
          retention-days: 7
